name: Sync upstream into Chinese branch

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout own repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/DiegoSolanoC/Overwatch-Atlas.git

      - name: Create sync branch
        run: |
          SYNC_BRANCH="automation/sync-upstream-${GITHUB_RUN_ID}"
          echo "SYNC_BRANCH=$SYNC_BRANCH" >> "$GITHUB_ENV"
          git switch -c "$SYNC_BRANCH"

      - name: Fetch and merge upstream
        run: |
          git fetch --prune upstream main
          git merge --no-edit upstream/main

      - name: Check content IDs and translations
        run: |
          node scripts/ensure-content-ids.mjs
          node scripts/i18n-check.mjs
          node scripts/check-official-terms.mjs
          node scripts/check-visible-chinese.mjs

      - name: Build Pages output
        run: npm run build:pages

      - name: Commit generated maintenance updates
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "No generated maintenance changes to commit."
          else
            git commit -m "chore: sync upstream content and localization metadata"
          fi

      - name: Push sync branch
        id: push
        run: |
          if git diff --quiet main...HEAD; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes relative to main."
          else
            git push --set-upstream origin "$SYNC_BRANCH"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request in own repository
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr create \
            --base main \
            --head "$SYNC_BRANCH" \
            --title "chore: sync upstream into Chinese branch" \
            --body "自动同步 DiegoSolanoC/Overwatch-Atlas 的 main。请检查合并冲突、中文译文覆盖和 sourceHash 复核项后再合并。"
